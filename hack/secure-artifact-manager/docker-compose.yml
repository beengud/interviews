version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        DATABASE_URL: "postgres://postgres:postgres@postgres:5432/artifacts"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/artifacts
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: artifacts
    ports:
      - "5432:5432"
    volumes:
      - ./docker-initdb:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - ./docker/minio/init.sh:/docker-entrypoint-initbucket.d/init.sh
    entrypoint: |
      /bin/sh -c "
        /usr/bin/docker-entrypoint.sh minio server /data --console-address ':9001' &
        sleep 5
        /docker-entrypoint-initbucket.d/init.sh
        wait
        "

volumes:
  postgres_data:
  minio_data:
