[package]
name = "backend"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
actix-web = "4"
actix-files = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
log = "0.4"
env_logger = "0.10"
actix-multipart = "0.6"
futures-util = "0.3"

sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "macros", "migrate"] }
aws-config = "1.0"
aws-sdk-s3 = "1.4"
actix-cors = "0.7.1"
